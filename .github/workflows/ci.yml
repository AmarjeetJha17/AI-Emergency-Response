name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      ConnectionStrings__TestDatabase: >-
        Server=127.0.0.1,1433;Database=EmergencyResponse_IntegrationTests;User Id=sa;Password=Testing_Password!2026;Encrypt=False;TrustServerCertificate=True;MultipleActiveResultSets=True
      ConnectionStrings__LoadTestDatabase: >-
        Server=127.0.0.1,1433;Database=EmergencyResponse_LoadTests;User Id=sa;Password=Testing_Password!2026;Encrypt=False;TrustServerCertificate=True;MultipleActiveResultSets=True
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2025-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Testing_Password!2026
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 20 --health-start-period 30s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore AI-Emergency-Response.slnx
      - name: Build
        run: dotnet build AI-Emergency-Response.slnx --configuration Release --no-restore
      - name: Performance smoke (report latency, gate errors)
        env:
          LOAD_TEST_PROFILE: Smoke
          LOAD_TEST_SCENARIO: mixed
          LOAD_TEST_MAX_ERROR_RATE: '0.01'
          BUILD_VERSION: ${{ github.sha }}
        run: dotnet run --project tests/EmergencyResponse.LoadTests/EmergencyResponse.LoadTests.csproj --configuration Release --no-build
      - name: Unit tests
        run: dotnet test tests/EmergencyResponse.UnitTests/EmergencyResponse.UnitTests.csproj --configuration Release --no-build --filter "Category=Unit" --logger "trx;LogFileName=unit.trx" --collect:"XPlat Code Coverage"
      - name: Security tests
        run: dotnet test tests/EmergencyResponse.UnitTests/EmergencyResponse.UnitTests.csproj --configuration Release --no-build --filter "Category=Security" --logger "trx;LogFileName=security.trx"
      - name: AI and resilience unit checks
        run: |
          dotnet test tests/EmergencyResponse.UnitTests/EmergencyResponse.UnitTests.csproj --configuration Release --no-build --filter "Category=AI" --logger "trx;LogFileName=ai.trx"
          dotnet test tests/EmergencyResponse.UnitTests/EmergencyResponse.UnitTests.csproj --configuration Release --no-build --filter "Category=Resilience" --logger "trx;LogFileName=resilience.trx"
      - name: Integration and smoke tests
        run: dotnet test tests/EmergencyResponse.IntegrationTests/EmergencyResponse.IntegrationTests.csproj --configuration Release --no-build --filter "Category=Integration" --logger "trx;LogFileName=integration.trx" --collect:"XPlat Code Coverage"
      - name: Smoke tests
        run: dotnet test tests/EmergencyResponse.IntegrationTests/EmergencyResponse.IntegrationTests.csproj --configuration Release --no-build --filter "Category=Smoke"
      - name: Offline AI evaluation
        run: dotnet run --project tests/EmergencyResponse.CopilotEvaluation/EmergencyResponse.CopilotEvaluation.csproj --configuration Release
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            **/TestResults/**/*.trx
            **/TestResults/**/coverage.cobertura.xml
            tests/EmergencyResponse.CopilotEvaluation/Reports/**/*.json
            tests/EmergencyResponse.CopilotEvaluation/Reports/**/*.jsonl
            tests/EmergencyResponse.CopilotEvaluation/Reports/**/*.html
            TestResults/loadtests/**
          if-no-files-found: warn
